<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Skill Exchange Marketplace</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body class="app-body">
  <script>
    // Failsafe error display
    window.addEventListener('error', function (e) {
      document.body.innerHTML = `
        <div style="padding: 2rem; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #FDF0D5; font-family: 'Inter', sans-serif; box-sizing: border-box;">
          <div style="max-width: 600px; width: 100%; padding: 2.5rem; background: #FFF; border: 3px solid #000; border-radius: 12px; box-shadow: 4px 4px 0 #000; box-sizing: border-box;">
            <h2 style="color: #DC2626; font-size: 1.75rem; font-weight: 900; text-transform: uppercase; margin-top: 0; margin-bottom: 1rem; text-shadow: 1px 1px 0 #000;">Application Error</h2>
            <p style="color: #1F2937; font-weight: 700; font-size: 1.1rem; margin-bottom: 1.5rem; line-height: 1.4;">${e.message}</p>
            <div style="background: #F3F4F6; border: 2px solid #000; border-radius: 6px; padding: 1rem; overflow-x: auto; box-sizing: border-box;">
              <pre style="margin: 0; font-family: monospace; font-size: 0.85rem; color: #4B5563; white-space: pre-wrap; word-break: break-all;">${e.error && e.error.stack ? e.error.stack : 'No stack trace available.'}</pre>
            </div>
            <p style="margin-top: 1.5rem; margin-bottom: 0; font-size: 0.9rem; font-weight: 600; color: #4B5563; text-align: center;">
              Need help? Check the console log or duplicate <b>config.example.js</b> to <b>config.js</b>.
            </p>
          </div>
        </div>
      `;
    });
    // Removed emergency local storage wipe so data persists
  </script>
  <div id="app" style="display: flex; flex-direction: column; flex: 1; min-height: 100vh;"></div>

  <!-- Global Modal Overlay -->
  <div id="global-modal"
    style="display: none; position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(2px);">
    <div id="modal-content" class="card"
      style="max-width: 500px; width: 100%; position: relative; animation: modalFadeIn 0.2s ease-out;">
      <button onclick="closeModal()"
        style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #4B5563;">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <style>
    @media(min-width: 768px) { .split-left { display: block !important; } }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-clickable {
      cursor: pointer;
    }

    .card-clickable:hover {
      border-color: var(--color-primary) !important;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script src="app.js?v=14"></script>
</body>

</html>
